<div class="modal hidden" id="v19RestoreBackupModal">
  <div class="modal-card">
    <div class="modal-title">Restore Full Backup</div>
    <div class="modal-sub">Choose a Lead Hopper full-backup JSON file. Nothing changes until the backup is validated and confirmed.</div>
    <div class="field" style="margin-top:10px">
      <label>Backup file</label>
      <input id="v19RestoreBackupInput" type="file" accept=".json,application/json">
    </div>
    <div id="v19RestoreBackupStatus" class="v13-small" style="margin-top:8px"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="v19CloseRestoreBackup()">Cancel</button>
      <button class="btn btn-solid" id="v19RestoreBackupConfirm" disabled>Restore Backup</button>
    </div>
  </div>
</div>
<script id="v19RestoreUiScript">
(function(){
  if(window.__LH_V19_RESTORE_UI__) return;
  window.__LH_V19_RESTORE_UI__ = true;

  var pendingText = null;
  var pendingLeadCount = 0;
  var modal = document.getElementById('v19RestoreBackupModal');
  var input = document.getElementById('v19RestoreBackupInput');
  var status = document.getElementById('v19RestoreBackupStatus');
  var confirmButton = document.getElementById('v19RestoreBackupConfirm');

  function resetRestore(){
    pendingText = null;
    pendingLeadCount = 0;
    if(input) input.value = '';
    if(status) status.textContent = '';
    if(confirmButton) confirmButton.disabled = true;
  }

  function resetValidationOnly(){
    pendingText = null;
    pendingLeadCount = 0;
    if(status) status.textContent = '';
    if(confirmButton) confirmButton.disabled = true;
  }

  window.v19OpenRestoreBackup = function(){
    resetRestore();
    if(modal) modal.classList.remove('hidden');
  };

  window.v19CloseRestoreBackup = function(){
    if(modal) modal.classList.add('hidden');
    resetRestore();
  };

  if(input){
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      resetValidationOnly();
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try {
          var text = String(reader.result || '');
          var restored = window.v19ParseBackupText(text);
          pendingText = text;
          pendingLeadCount = restored.leads.length;
          status.textContent = 'Validated backup: ' + pendingLeadCount + ' lead(s).';
          confirmButton.disabled = false;
        } catch(err){
          status.textContent = 'Restore rejected: ' + (err && err.message ? err.message : err);
          confirmButton.disabled = true;
        }
      };
      reader.onerror = function(){
        status.textContent = 'Could not read that backup file.';
        confirmButton.disabled = true;
      };
      reader.readAsText(file);
    });
  }

  if(confirmButton){
    confirmButton.addEventListener('click', function(){
      if(!pendingText) return;
      showDangerConfirm({
        title: 'Restore Lead Hopper backup?',
        textHtml: 'This will replace the current local state with the validated backup containing <b>' + pendingLeadCount + ' lead(s)</b>.',
        confirmLabel: 'Restore Backup',
        onConfirm: function(){
          try { window.v19ApplyBackupText(pendingText, true); }
          catch(err){ showToast('Restore failed. Current state was not changed: ' + (err && err.message ? err.message : err), [], 6500); }
        }
      });
    });
  }

  var menu = document.querySelector('#v13MenuOverlay .v13-menu');
  if(menu && !document.getElementById('v19RestoreBackupMenu')){
    var restoreButton = document.createElement('button');
    restoreButton.className = 'v13-menu-item';
    restoreButton.id = 'v19RestoreBackupMenu';
    restoreButton.textContent = '⇩ Restore Full Backup';
    restoreButton.addEventListener('click', function(){
      try { v13CloseMenu(); } catch(_e) {}
      window.v19OpenRestoreBackup();
    });
    var buttons = Array.prototype.slice.call(menu.querySelectorAll('.v13-menu-item'));
    var backupButton = buttons.filter(function(b){ return b.textContent.indexOf('Backup / Export') >= 0; })[0];
    if(backupButton && backupButton.parentNode) backupButton.parentNode.insertBefore(restoreButton, backupButton.nextSibling);
    else menu.appendChild(restoreButton);
  }
})();
</script>
<style id="v19BridgeLayout">
.modal{padding:12px!important;align-items:flex-start!important;overflow:auto!important}
.modal-card{max-height:calc(100dvh - 24px)!important;max-height:calc(100vh - 24px);overflow:auto!important;margin:auto!important;box-sizing:border-box}
body:has(.modal:not(.hidden)) .actions{visibility:hidden!important}
#v13SettingsModal .modal-card{min-height:0!important}
</style>
<script id="v19BridgeCommands">
(function(){
  // The legacy bridge groups nested saves until the entire command has succeeded.
  // Native 2.0 replaces this adapter with Room transactions.
  window.v19AfterCommit=function(fn){if(window.__LH_TRANSACTION__)window.__LH_TRANSACTION__.effects.push(fn);else fn();};
  window.v19Transaction=function(fn){
    if(window.__LH_TRANSACTION__)return fn();
    if(!window.__LH_STORAGE_READY__)return false;
    var before=JSON.stringify(state),snapshotBefore=lastSnapshot,tx={dirty:false,effects:[]};
    var toast=showToast,render=renderAll,timeout=window.setTimeout;
    window.__LH_TRANSACTION__=tx;
    showToast=function(){var args=arguments;tx.effects.push(function(){toast.apply(window,args);});};
    renderAll=function(){tx.render=true;};
    window.setTimeout=function(fn,ms){var args=Array.prototype.slice.call(arguments,2);tx.effects.push(function(){timeout.apply(window,[fn,ms].concat(args));});return 0;};
    try{
      var result=fn();window.__LH_TRANSACTION__=null;
      showToast=toast;renderAll=render;window.setTimeout=timeout;
      if(tx.dirty)saveAll();
      if(tx.render)render();
      tx.effects.forEach(function(effect){effect();});return result;
    }catch(err){
      window.__LH_TRANSACTION__=null;showToast=toast;renderAll=render;window.setTimeout=timeout;
      state=JSON.parse(before);lastSnapshot=snapshotBefore;actionLock=false;
      render();toast('Change failed. Your previous saved state is intact.',[],7000);return false;
    }
  };
  ['uiCallNow','applyDisposition','saveCallback','saveAppointment','saveNoEnglish','saveScheduleAdd','saveEditLead','nextLead','prevLead','v13UseCustom','v13SaveManualLead','v13SaveSettings','doImport','endSession','restoreSnapshot'].forEach(function(name){
    var fn=window[name];if(typeof fn!=='function')return;
    window[name]=function(){var self=this,args=arguments;return v19Transaction(function(){return fn.apply(self,args);});};
  });
  var danger=showDangerConfirm;
  showDangerConfirm=function(options){var callback=options.onConfirm;if(callback)options.onConfirm=function(){return v19Transaction(callback);};return danger(options);};
  var callGate=requireRecentCall;
  requireRecentCall=function(lead){
    if(!lead)return false;
    if(lead.lastDispositionCall && lastCallAt(lead) && lead.lastDispositionCall===lastCallAt(lead).toISOString()){
      showToast('This call already has an outcome. Use Undo or Edit to correct it.',[],3000);return false;
    }
    return callGate(lead);
  };
  // Captured form identity prevents a stale dialog from changing a new current person.
  ['Callback','Appt'].forEach(function(kind){var name='open'+kind+'ModalFromLead',open=window[name];window[name]=function(lead){state.pendingFormLeadId=lead.id;return open(lead);};});
  ['saveCallback','saveAppointment'].forEach(function(name){var save=window[name];window[name]=function(){var lead=getCurrentLead();if(state.pendingFormLeadId&&(!lead||lead.id!==state.pendingFormLeadId)){showToast('This form belongs to a different lead. Reopen it.',[],3000);return false;}return save();};});
  var mark=markAdvanceReady;
  markAdvanceReady=function(lead,disp){mark(lead,disp);if(lastCallAt(lead))lead.lastDispositionCall=lastCallAt(lead).toISOString();};
  var download=downloadText;
  downloadText=window.downloadText=function(filename,text,mime,sessionId){
    if(window.AndroidBridge&&AndroidBridge.saveTextWithId){
      var id=uid();state.pendingExports=state.pendingExports||{};state.pendingExports[id]={sessionId:sessionId||null};saveAll();
      AndroidBridge.saveTextWithId(id,filename,String(text),mime||'text/plain');return id;
    }
    return download(filename,text,mime);
  };
  window.v19ExportResult=function(id,status){
    var pending=state.pendingExports&&state.pendingExports[id];if(!pending)return;
    v19Transaction(function(){if(status==='saved'&&pending.sessionId){var session=(state.sessions||[]).find(function(s){return s.id===pending.sessionId;});if(session)session.exportedAt=nowISO();}delete state.pendingExports[id];saveAll();});
  };
  window.v19HandleBack=function(){
    var visible=Array.prototype.slice.call(document.querySelectorAll('.modal:not(.hidden),#v13MenuOverlay:not(.hidden),#v13CustomPop:not(.hidden)')).filter(function(x){return getComputedStyle(x).display!=='none';});
    if(visible.length){var top=visible[visible.length-1];top.classList.add('hidden');top.style.display='';return true;}
    if(state.activeTab!=='hopper'){setTab('hopper');return true;}return false;
  };
  document.addEventListener('click',function(e){var b=e.target.closest('.js-open-person');if(b)jumpToLead(b.dataset.person);});
  // Remove malformed orphan action rows; these have no edit form parent.
  document.querySelectorAll('body > .modal-actions').forEach(function(x){x.remove();});
  var menu=document.querySelector('#v13MenuOverlay .v13-menu');
  if(menu){var end=document.createElement('button');end.className='v13-menu-item';end.textContent='End Session';end.onclick=function(){v13CloseMenu();endSession();};menu.appendChild(end);}
})();
</script>

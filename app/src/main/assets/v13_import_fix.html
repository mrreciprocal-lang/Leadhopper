<style id="v13ImportFixStyles">
#importModal{z-index:10050!important}
#v13MenuOverlay.hidden{display:none!important}
#v13MenuOverlay:not(.hidden){display:flex!important;pointer-events:auto!important}
</style>
<script id="v13ImportFixScript">
(function(){
  function showImportModal(){
    var modal=document.getElementById('importModal');
    if(!modal){
      try{showToast('Import window is unavailable. Please restart Lead Hopper.',[],2600);}catch(e){}
      return false;
    }
    var menu=document.getElementById('v13MenuOverlay');
    if(menu) menu.classList.add('hidden');
    modal.classList.remove('hidden');
    modal.style.display='flex';
    modal.style.zIndex='10050';
    var format=document.getElementById('importFormat');
    if(format && !format.value) format.value='csv';
    return true;
  }
  window.openImport=showImportModal;
  window.closeImport=function(){
    var modal=document.getElementById('importModal');
    if(modal){modal.classList.add('hidden');modal.style.display='';}
  };
  window.v13OpenMenu=function(){
    var overlay=document.getElementById('v13MenuOverlay');
    if(!overlay)return false;
    overlay.classList.remove('hidden');
    overlay.style.display='flex';
    return true;
  };
  window.v13CloseMenu=function(){
    var overlay=document.getElementById('v13MenuOverlay');
    if(!overlay)return false;
    overlay.classList.add('hidden');
    overlay.style.display='';
    return true;
  };
  var menuBtn=document.getElementById('menuBtn');
  if(menuBtn){
    menuBtn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      window.v13OpenMenu();
    },true);
  }
  document.addEventListener('click',function(e){
    var btn=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!btn) return;
    var label=(btn.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
    if(label==='import leads' || label.endsWith(' import leads')){
      e.preventDefault();
      e.stopPropagation();
      showImportModal();
    }
  },true);
})();
</script>

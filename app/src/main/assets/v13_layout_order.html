<style id="v13LayoutOrderStyles">
.primary-actions{display:grid!important;grid-template-columns:1fr!important;gap:7px!important}
.primary-actions #btnCallNow{width:100%!important;height:78px!important;min-height:78px!important;padding:8px!important;border-radius:18px!important;box-shadow:0 0 0 1px rgba(134,239,172,.16),0 14px 38px rgba(16,185,129,.38)!important}
.primary-actions #btnCallNow .btn-content{padding:15px 12px!important;font-size:20px!important;letter-spacing:.3px!important}

/* Four equal columns let the two common-action rows divide into true 50/50 halves. */
.secondary-actions{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important}
.secondary-actions #btnNI{grid-column:1/3!important;grid-row:1!important}
.secondary-actions #btnNoAnswer{grid-column:3/5!important;grid-row:1!important}
.secondary-actions #btnCallback{grid-column:1/3!important;grid-row:2!important}
.secondary-actions #btnAppt{grid-column:3/5!important;grid-row:2!important}

/* The four buttons directly under Call Now are identical: true half-widths and 75% of Call Now height. */
.secondary-actions #btnNI,
.secondary-actions #btnNoAnswer,
.secondary-actions #btnCallback,
.secondary-actions #btnAppt{
  width:100%!important;
  height:59px!important;
  min-height:59px!important;
  max-height:59px!important;
  padding:6px!important;
  border-radius:14px!important;
  box-sizing:border-box!important;
}
.secondary-actions #btnNI .btn-content,
.secondary-actions #btnNoAnswer .btn-content,
.secondary-actions #btnCallback .btn-content,
.secondary-actions #btnAppt .btn-content{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
  height:100%!important;
  box-sizing:border-box!important;
  padding:6px 5px!important;
  font-size:12px!important;
  line-height:1.1!important;
  text-align:center!important;
}

.secondary-actions #btnDNC{grid-column:1!important;grid-row:3!important}
.secondary-actions #btnNoEnglish{grid-column:2!important;grid-row:3!important}
.secondary-actions #btnWrongNumber{grid-column:3!important;grid-row:3!important}
.secondary-actions #btnStateFarm{grid-column:4!important;grid-row:3!important}

@media(max-height:760px){
  .primary-actions #btnCallNow{height:64px!important;min-height:64px!important;padding:5px!important}
  .primary-actions #btnCallNow .btn-content{padding:11px 8px!important;font-size:18px!important}
  .secondary-actions #btnNI,
  .secondary-actions #btnNoAnswer,
  .secondary-actions #btnCallback,
  .secondary-actions #btnAppt{height:48px!important;min-height:48px!important;max-height:48px!important}
}
</style>
<script id="v13LayoutOrderScript">
(function(){
function applyV13LayoutOrder(){
 const primary=document.querySelector('.primary-actions');
 const secondary=document.querySelector('.secondary-actions');
 if(!primary||!secondary)return;
 const call=document.getElementById('btnCallNow');
 const ni=document.getElementById('btnNI');
 const no=document.getElementById('btnNoAnswer');
 const cb=document.getElementById('btnCallback');
 const appt=document.getElementById('btnAppt');
 const dnc=document.getElementById('btnDNC');
 const ne=document.getElementById('btnNoEnglish');
 const wrong=document.getElementById('btnWrongNumber');
 const plus=document.getElementById('btnStateFarm');
 if(call)primary.appendChild(call);
 [ni,no,cb,appt,dnc,ne,wrong,plus].forEach(x=>{if(x)secondary.appendChild(x)});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',applyV13LayoutOrder);else applyV13LayoutOrder();
})();
</script>

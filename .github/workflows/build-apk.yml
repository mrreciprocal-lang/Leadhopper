name: Build Lead Hopper APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Lead Hopper V13 HTML
        run: cat app/src/main/assets/index.html.gz.b64.part* | base64 -d | gzip -d > app/src/main/assets/index.html

      - name: Apply tested V13 hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app/src/main/assets/index.html')
          hot = Path('app/src/main/assets/v13_hotfix.html').read_text(encoding='utf-8')
          layout = Path('app/src/main/assets/v13_layout_order.html').read_text(encoding='utf-8')
          text = app.read_text(encoding='utf-8')
          if 'id="v13HotfixScript"' not in text:
              text = text.replace('</body>', hot + '\n</body>')
          if 'id="v13LayoutOrderScript"' not in text:
              text = text.replace('</body>', layout + '\n</body>')
          app.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Align unsigned release APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            LeadHopper-V13-release-unsigned-aligned.apk

      - name: Package apksigner tool
        run: |
          mkdir -p signing-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/lib/
          chmod +x signing-tool/apksigner

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-V13-release-unsigned
          path: LeadHopper-V13-release-unsigned-aligned.apk
          if-no-files-found: error

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-signing-tool
          path: signing-tool
          if-no-files-found: error

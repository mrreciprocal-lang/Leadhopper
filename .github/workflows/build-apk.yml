name: Build Lead Hopper APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Lead Hopper V13 HTML
        run: cat app/src/main/assets/index.html.gz.b64.part* | base64 -d | gzip -d > app/src/main/assets/index.html

      - name: Apply tested V13 patches safely
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/assets/index.html')
          hot = Path('app/src/main/assets/v13_hotfix.html').read_text(encoding='utf-8')
          layout = Path('app/src/main/assets/v13_layout_order.html').read_text(encoding='utf-8')
          text = app.read_text(encoding='utf-8')

          def insert_before_final_body(document, fragment):
              head, sep, tail = document.rpartition('</body>')
              if not sep:
                  raise RuntimeError('Final </body> tag not found')
              return head + fragment + '\n</body>' + tail

          if 'id="v13HotfixScript"' not in text:
              text = insert_before_final_body(text, hot)
          if 'id="v13LayoutOrderScript"' not in text:
              text = insert_before_final_body(text, layout)

          app.write_text(text, encoding='utf-8')
          PY

      - name: Validate packaged HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')

          # The daily-report template intentionally contains a literal </body></html>.
          # V13 patches must be after the application's original JS, never inside it.
          hot = text.find('id="v13HotfixScript"')
          layout = text.find('id="v13LayoutOrderScript"')
          init = text.find('function init()')
          final_body = text.rfind('</body>')
          final_html = text.rfind('</html>')

          assert hot > init, 'Hotfix was injected inside the main JavaScript source'
          assert layout > init, 'Layout patch was injected inside the main JavaScript source'
          assert final_body > hot and final_body > layout, 'V13 patches are not inside the real document body'
          assert final_html > final_body, 'Malformed document ending'
          assert text.rstrip().endswith('</html>'), 'Document does not end with </html>'
          print('Packaged HTML structure OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build V14 release and installable debug APKs
        run: gradle --no-daemon assembleRelease assembleDebug

      - name: Prepare installable V14 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LeadHopper-V14-installable.apk

      - name: Align unsigned V14 release APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            LeadHopper-V14-release-unsigned-aligned.apk

      - name: Package apksigner tool
        run: |
          mkdir -p signing-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/lib/
          chmod +x signing-tool/apksigner

      - name: Upload installable V14 APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-V14-installable
          path: LeadHopper-V14-installable.apk
          if-no-files-found: error

      - name: Upload unsigned V14 release APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-V14-release-unsigned
          path: LeadHopper-V14-release-unsigned-aligned.apk
          if-no-files-found: error

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-signing-tool
          path: signing-tool
          if-no-files-found: error

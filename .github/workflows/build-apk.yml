name: Build Lead Hopper APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified tornado launcher artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/icon-src/leadhopper_tornado_192.webp.b64 > app/src/main/res/drawable-nodpi/leadhopper_tornado_icon.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/res/drawable-nodpi/leadhopper_tornado_icon.webp')
          b=p.read_bytes()
          assert len(b) > 8000, f'Launcher artwork unexpectedly small: {len(b)} bytes'
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'Launcher artwork is not a valid WebP container'
          print('Verified tornado launcher artwork:', len(b), 'bytes')
          PY

      - name: Restore Lead Hopper V13 HTML
        run: cat app/src/main/assets/index.html.gz.b64.part* | base64 -d | gzip -d > app/src/main/assets/index.html

      - name: Apply tested V13-V16 patches safely
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/assets/index.html')
          fragments = [
              ('v13HotfixScript', 'v13_hotfix.html'),
              ('v13LayoutOrderScript', 'v13_layout_order.html'),
              ('v13ImportFixScript', 'v13_import_fix.html'),
              ('v14CustomPopupDismissScript', 'v14_custom_popup_dismiss.html'),
              ('v14CallbackAutoAdvanceScript', 'v14_callback_autoadvance.html'),
              ('v16HopperUiRepairScript', 'v16_hopper_ui_repair.html'),
          ]
          text = app.read_text(encoding='utf-8')

          def insert_before_final_body(document, fragment):
              head, sep, tail = document.rpartition('</body>')
              if not sep:
                  raise RuntimeError('Final </body> tag not found')
              return head + fragment + '\n</body>' + tail

          for marker, filename in fragments:
              if f'id="{marker}"' not in text:
                  text = insert_before_final_body(text, Path('app/src/main/assets', filename).read_text(encoding='utf-8'))

          app.write_text(text, encoding='utf-8')
          PY

      - name: Validate packaged HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')

          markers = [
              'v13HotfixScript',
              'v13LayoutOrderScript',
              'v13ImportFixScript',
              'v14CustomPopupDismissScript',
              'v14CallbackAutoAdvanceScript',
              'v16HopperUiRepairScript',
          ]
          init = text.find('function init()')
          final_body = text.rfind('</body>')
          final_html = text.rfind('</html>')
          for marker in markers:
              pos=text.find(f'id="{marker}"')
              assert pos > init, f'{marker} was injected inside the main JavaScript source'
              assert final_body > pos, f'{marker} is not inside the real document body'

          assert final_html > final_body, 'Malformed document ending'
          assert text.rstrip().endswith('</html>'), 'Document does not end with </html>'
          assert 'window.openImport=showImportModal' in text, 'Import button recovery handler missing'
          assert 'v14CloseCustomPopup' in text, 'Custom popup outside-tap handler missing'
          assert '__LH_V14_CALLBACK_AUTO_ADVANCE__' in text, 'Callback auto-advance handler missing'
          assert '__LH_V16_HOPPER_UI_REPAIR__' in text, 'V16 hopper UI repair missing'
          assert 'v16-nav-row' in text, 'Stable Previous/Next layout missing'
          assert 'total += 1' in text, 'Held-lead counter repair missing'
          print('Packaged HTML structure OK; V16 counter, lock, layout, import, popup and callback handlers present')
          PY

      - name: Validate V16 Android identity and launcher icon
        run: |
          grep -q 'versionCode = 16' app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' app/build.gradle.kts
          grep -q 'android:icon="@drawable/leadhopper_tornado_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/leadhopper_tornado_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/leadhopper_tornado_icon.webp
          echo 'V16 identity, privacy hardening, and direct verified tornado bitmap present'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build V16 release and installable debug APKs
        run: gradle --no-daemon assembleRelease assembleDebug

      - name: Prepare installable V16 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LeadHopper-V16-installable.apk

      - name: Align unsigned V16 release APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            LeadHopper-V16-release-unsigned-aligned.apk

      - name: Package apksigner tool
        run: |
          mkdir -p signing-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/lib/
          chmod +x signing-tool/apksigner

      - name: Upload installable V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-V16-installable
          path: LeadHopper-V16-installable.apk
          if-no-files-found: error

      - name: Upload unsigned V16 release APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-V16-release-unsigned
          path: LeadHopper-V16-release-unsigned-aligned.apk
          if-no-files-found: error

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-signing-tool
          path: signing-tool
          if-no-files-found: error

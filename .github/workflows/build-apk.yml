name: Build Lead Hopper Cleanline APK

on:
  workflow_dispatch:
  push:
    branches: [ package-diagnostics ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore launcher art
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat app/icon-src/v173/foreground.webp.b64.part* | tr -d '\r\n' | base64 -d > app/src/main/res/drawable-nodpi/leadhopper_icon_foreground_art.webp
          tr -d '\r\n' < app/icon-src/v174/monoglyph.webp.b64 | base64 -d > app/src/main/res/drawable-nodpi/leadhopper_icon_monochrome_art.webp

      - name: Assemble 1.7.5 baseline HTML plus selected fixes
        run: |
          cat app/src/main/assets/index.html.gz.b64.part* | base64 -d | gzip -d > app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          app=Path('app/src/main/assets/index.html')
          fragments=[
            ('v13HotfixScript','v13_hotfix.html'),
            ('v13LayoutOrderScript','v13_layout_order.html'),
            ('v13ImportFixScript','v13_import_fix.html'),
            ('v14CustomPopupDismissScript','v14_custom_popup_dismiss.html'),
            ('v14CallbackAutoAdvanceScript','v14_callback_autoadvance.html'),
            ('v16HopperUiRepairScript','v16_hopper_ui_repair.html'),
            ('v17UiNotesScript','v17_ui_notes.html'),
            ('v18ActivityReportsRepairScript','v18_activity_reports_repair.html'),
          ]
          text=app.read_text(encoding='utf-8')
          for marker,filename in fragments:
              if f'id="{marker}"' in text:
                  continue
              head,sep,tail=text.rpartition('</body>')
              if not sep:
                  raise RuntimeError('Final </body> tag not found')
              fragment=Path('app/src/main/assets',filename).read_text(encoding='utf-8')
              text=head+fragment+'\n</body>'+tail
          app.write_text(text,encoding='utf-8')
          assert 'versionCode' not in text
          assert 'height:59px!important' in text
          assert 'contactKey' in text
          assert 'v17LastCalled' in text
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Align APK
        run: $ANDROID_HOME/build-tools/35.0.0/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk LeadHopper-1.7.5-cleanline-v102-unsigned.apk

      - name: Package signing tool
        run: |
          mkdir -p signing-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/lib/
          chmod +x signing-tool/apksigner

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-1.7.5-cleanline-v102-unsigned
          path: LeadHopper-1.7.5-cleanline-v102-unsigned.apk
          if-no-files-found: error

      - name: Upload signing tool
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-cleanline-signing-tool
          path: signing-tool
          if-no-files-found: error

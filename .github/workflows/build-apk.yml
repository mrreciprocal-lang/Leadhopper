name: Build Lead Hopper APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Lead Hopper V13 HTML
        run: cat app/src/main/assets/index.html.gz.b64.part* | base64 -d | gzip -d > app/src/main/assets/index.html

      - name: Apply tested V13 hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app/src/main/assets/index.html')
          hot = Path('app/src/main/assets/v13_hotfix.html').read_text(encoding='utf-8')
          text = app.read_text(encoding='utf-8')
          if 'id="v13HotfixScript"' not in text:
              text = text.replace('</body>', hot + '\n</body>')
          app.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LeadHopper-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-v1.0
          path: LeadHopper-v1.0.apk
          if-no-files-found: error

name: Lead Hopper Data Survival Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'stabilization/**'
    paths:
      - 'app/**'
      - 'tools/prepare_leadhopper_assets.py'
      - 'docs/LEAD_HOPPER_TORTURE_CONTRACT.md'
      - '.github/workflows/data-survival-torture.yml'

concurrency:
  group: leadhopper-data-survival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-survival:
    name: Data survival API 35
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4

      - name: Restore locked icon assets
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat app/icon-src/v173/foreground.webp.b64.part* | tr -d '\r\n' | base64 -d > app/src/main/res/drawable-nodpi/leadhopper_icon_foreground_art.webp
          tr -d '\r\n' < app/icon-src/v174/monoglyph.webp.b64 | base64 -d > app/src/main/res/drawable-nodpi/leadhopper_icon_monochrome_art.webp

      - name: Assemble exact production HTML
        run: python tools/prepare_leadhopper_assets.py

      - name: Prove persistence guard ordering and backup contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          required = [
              'id="v19DataSurvivalScript"',
              'id="v13Script"',
              'id="v19RestoreUiScript"',
              '__LH_V19_DATA_SURVIVAL__',
              '__LH_V19_RESTORE_UI__',
              'lead-hopper-full-backup',
              'v19ParseBackupText',
              'v19ApplyBackupText',
              'v19RestoreBackupInput',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing data-survival contracts: ' + ', '.join(missing))
          for marker in ['id="v19DataSurvivalScript"', 'id="v13Script"', 'id="v19RestoreUiScript"']:
              if text.count(marker) != 1:
                  raise SystemExit(f'{marker} count={text.count(marker)}, expected 1')
          if not text.index('id="v19DataSurvivalScript"') < text.index('id="v13Script"') < text.index('id="v19RestoreUiScript"'):
              raise SystemExit('Persistence guard is not executing before V13 bootstrap')
          print('Data survival assembly contract PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 35 emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build app and data-survival tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Boot API 35 emulator
        shell: bash
        run: |
          OUT="data-survival-artifacts"
          mkdir -p "$OUT"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/leadhopper-data-survival-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force \
            --name "leadhopper-data-survival" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$OUT/emulator-list-avds.txt"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq "leadhopper-data-survival"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "leadhopper-data-survival" \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none -camera-front none \
            -memory 2048 \
            > "$OUT/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb devices -l | tee "$OUT/adb-devices.txt"
          adb shell getprop ro.build.version.sdk | tee "$OUT/device-api.txt"

      - name: Install exact app and test APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk | tee data-survival-artifacts/install-app.txt
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee data-survival-artifacts/install-test.txt
          adb shell pm list instrumentation | tee data-survival-artifacts/instrumentation-list.txt
          adb shell pm list instrumentation | grep -Fq 'com.kyle.leadhopper.test/androidx.test.runner.AndroidJUnitRunner'

      - name: Run data survival tests against real WebView
        id: tests
        shell: bash
        run: |
          set +e
          adb logcat -c
          timeout 180 adb shell am instrument -w -r \
            -e class com.kyle.leadhopper.LeadHopperDataSurvivalTest,com.kyle.leadhopper.MigrationSnapshotStoreTest \
            com.kyle.leadhopper.test/androidx.test.runner.AndroidJUnitRunner \
            2>&1 | tee data-survival-artifacts/data-survival-tests.txt
          code=${PIPESTATUS[0]}
          if grep -Eiq 'INSTRUMENTATION_FAILED|FAILURES!!!|Process crashed|shortMsg=' data-survival-artifacts/data-survival-tests.txt; then code=1; fi
          if ! grep -Fq 'OK (9 tests)' data-survival-artifacts/data-survival-tests.txt; then code=1; fi
          echo "$code" > data-survival-artifacts/test-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          adb logcat -d -v threadtime > data-survival-artifacts/logcat.txt 2>/dev/null || true
          exit 0

      - name: Re-run frozen golden behaviors after persistence surgery
        id: golden
        shell: bash
        run: |
          set +e
          CLASS=com.kyle.leadhopper.LeadHopperTortureTest
          RUNNER=com.kyle.leadhopper.test/androidx.test.runner.AndroidJUnitRunner
          methods=(
            productionPackageContainsEveryLockedRepairMarker
            hopperButtonsAreTrueFiftyFiftyAndEqualHeight
            activityBackControlReturnsToHopper
            reportAndCsvExportsAreRoutedThroughNativeSaveBridge
            noAnswerMovesLeadToTailAndAutoAdvances
            sameTimeDueCallbacksUseOriginalSchedulingOrder
            appointmentSpacingHonorsExactBoundary
          )
          overall=0
          for method in "${methods[@]}"; do
            echo "=== GOLDEN: $method ===" | tee -a data-survival-artifacts/golden-regressions.txt
            timeout 90 adb shell am instrument -w -r \
              -e class "$CLASS#$method" \
              "$RUNNER" \
              2>&1 | tee -a data-survival-artifacts/golden-regressions.txt
            code=${PIPESTATUS[0]}
            if [ "$code" != "0" ]; then overall=1; fi
          done
          if grep -Eiq 'INSTRUMENTATION_FAILED|FAILURES!!!|Process crashed|shortMsg=' data-survival-artifacts/golden-regressions.txt; then overall=1; fi
          if [ "$(grep -Fc 'OK (1 test)' data-survival-artifacts/golden-regressions.txt)" != "7" ]; then overall=1; fi
          echo "$overall" > data-survival-artifacts/golden-exit-code.txt
          echo "exit_code=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload data survival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeadHopper-data-survival-evidence
          path: data-survival-artifacts
          if-no-files-found: error

      - name: Enforce data survival and frozen behavior gates
        if: always()
        run: |
          data_code="${{ steps.tests.outputs.exit_code }}"
          golden_code="${{ steps.golden.outputs.exit_code }}"
          if [ -z "$data_code" ]; then data_code=99; fi
          if [ -z "$golden_code" ]; then golden_code=99; fi
          echo "data_survival=$data_code golden_regressions=$golden_code"
          if [ "$data_code" != "0" ] || [ "$golden_code" != "0" ]; then
            echo "Lead Hopper data survival/frozen behavior gate failed. Inspect uploaded evidence."
            exit 1
          fi
